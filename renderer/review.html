<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<!-- 样式必须外链：CSP style-src 'self' 拦截内联 <style>/style 属性 -->
<link rel="stylesheet" href="review.css">
<title>ReadPicks 今日复习</title>
</head>
<body>
  <div class="top">
    <span id="progress"></span>
    <span class="key-hint">空格 翻面 · 1/2/3 打分</span>
    <button class="close" id="close">✕</button>
  </div>

  <div id="card" class="card hidden">
    <div id="front" class="front"></div>
    <div id="back" class="hidden"></div>
  </div>

  <div class="actions hidden" id="actions">
    <button id="again">忘记<span class="key">1</span></button>
    <button id="hard">模糊<span class="key">2</span></button>
    <button id="good">认识<span class="key">3</span></button>
  </div>

  <div id="done" class="done hidden">
    <div id="done-title">今日复习完成</div>
    <div class="sub" id="done-sub"></div>
  </div>

<script src="review.js"></script>
</body>
</html>
