<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src https: data:; media-src https:">
<title>ReadPicks 拾词</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="card" class="card">
    <!-- 头部：拖动区 -->
    <header id="header">
      <span class="brand">拾词</span>
      <span id="drag-zone"></span>
      <button id="pin" class="icon-btn" title="钉住"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16h14v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg></button>
      <button id="settings" class="icon-btn" title="设置"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button>
      <button id="close" class="icon-btn" title="关闭 (Esc)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </header>

    <!-- 加载态 -->
    <div id="loading" class="loading hidden">查询中…</div>

    <!-- 单词卡 -->
    <div id="word-view" class="view hidden">
      <div class="word-row">
        <h1 id="word"></h1>
        <span id="phonetic" class="phonetic"></span>
        <button id="speak-en" class="icon-btn" title="英式发音">UK</button>
        <button id="speak-us" class="icon-btn" title="美式发音">US</button>
      </div>
      <div id="badges" class="badges"></div>
      <div id="en-def-section" class="section hidden">
        <div class="section-title">英英释义（按你的词汇水平）</div>
        <div id="en-def"></div>
      </div>
      <details id="defs-details" class="defs-details">
        <summary id="defs-summary">中文释义</summary>
        <ul id="defs" class="defs"></ul>
      </details>
      <div id="meta" class="meta"></div>
      <p id="llm-pending" class="hint hidden">语境释义生成中…（本地释义已可用）</p>
      <p id="context-hint" class="hint hidden">阅读时先复制（Ctrl+C）包含该词的句子，再查该词，这里会自动显示「本句译法」</p>

      <!-- 语境区 -->
      <section id="context-section" class="section hidden">
        <div class="section-title">语境句子（本句译法）</div>
        <p id="context" class="context"></p>
        <p id="context-trans" class="context-trans"></p>
        <p id="word-in-sentence" class="word-in-sentence hidden"></p>
        <p id="explain" class="explain hidden"></p>
        <p id="usage" class="usage hidden"></p>
        <p id="llm-hint" class="hint hidden">在设置中配置 LLM 翻译源，可获得「此处意思与用法」的逐词解释</p>
        <div id="other-words" class="other-words hidden"></div>
      </section>

      <section class="section">
        <details id="history-details">
          <summary>查询历史</summary>
          <div id="history"></div>
        </details>
        <details id="note-details">
          <summary>我的笔记</summary>
          <textarea id="note" rows="3" placeholder="记录这个词的用法、记忆方法…"></textarea>
          <button id="note-save" class="btn small">保存笔记</button>
        </details>
      </section>
    </div>

    <!-- 句子视图 -->
    <div id="sentence-view" class="view hidden">
      <div class="section-title">原文</div>
      <p id="s-raw" class="context"></p>
      <div class="section-title">译文</div>
      <p id="s-trans" class="context-trans"></p>
      <p id="s-error" class="error hidden"></p>
      <button id="s-copy" class="btn">复制译文</button>
    </div>

    <p id="error" class="error hidden"></p>

    <!-- 最近查询（历史入口） -->
    <div id="recent-section" class="section hidden">
      <div class="section-title">最近查询</div>
      <div id="recent-chips" class="other-words"></div>
    </div>
  </div>
<script src="popup.js"></script>
</body>
</html>
